<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Termômetro de Maturidade em Automação</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: #ffffff; max-width: 650px; width: 100%; border-radius: 10px; padding: 30px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    h1 { font-size: 22px; color: #1a1a1a; margin-top: 0; text-align: center; }
    p.desc { font-size: 14px; color: #555; text-align: center; margin-bottom: 25px; }
    .question { margin-bottom: 20px; }
    .question label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #2d3748; }
    select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; background: #fff; }
    button { width: 100%; padding: 12px; background: #2b6cb0; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #2c5282; }
    #result-box { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e2e8f0; display: none; }
    .thermometer-track { width: 100%; height: 24px; background: #edf2f7; border-radius: 12px; overflow: hidden; margin: 15px 0; border: 1px solid #cbd5e0; }
    .thermometer-fill { height: 100%; width: 0%; transition: width 0.6s ease-in-out; border-radius: 12px; }
    .score-title { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 5px; }
    .score-desc { font-size: 14px; color: #4a5568; line-height: 1.5; background: #f7fafc; padding: 15px; border-radius: 6px; border-left: 4px solid #2b6cb0; }
  </style>
</head>
<body>

<div class="container">
  <h1>Termômetro de Automação</h1>
  <p class="desc">Descubra se suas soluções operam em padrões legados de repetição ou em arquitetura reativa escalável.</p>

  <form id="quiz-form">
    <div class="question">
      <label>1. Como suas automações descobrem novos dados?</label>
      <select id="q1" required>
        <option value="">Selecione...</option>
        <option value="1">Executo scripts manuais ou cron a cada X minutos perguntando ao serviço (Polling clássico)</option>
        <option value="2">Combinação de agendamentos com checagem visual em planilhas</option>
        <option value="3">Uso gatilhos nativos de plataformas low-code sem saber se é webhook ou polling</option>
        <option value="4">Recepção passiva imediata via HTTP POST (Webhooks / Event-Driven)</option>
      </select>
    </div>

    <div class="question">
      <label>2. Como você lida com eventos duplicados (ex.: dois disparos da mesma compra)?</label>
      <select id="q2" required>
        <option value="1">Não trato; às vezes registros repetidos entram no sistema</option>
        <option value="2">Apago as duplicatas manualmente quando percebo na tabela</option>
        <option value="3">Uso filtros simples de busca antes de gravar o novo dado</option>
        <option value="4">Garantia de Idempotência checando o identificador único (ID) do evento na entrada</option>
      </select>
    </div>

    <div class="question">
      <label>3. Quando um webhook chega ao seu sistema, o que você responde?</label>
      <select id="q3" required>
        <option value="1">Não sei o que é resposta HTTP ou deixo a conexão fechar sozinha</option>
        <option value="2">Faço todo o processamento demorado antes de devolver a resposta</option>
        <option value="3">Respondo texto puro sem configurar cabeçalhos de status</option>
        <option value="4">Devolvo status 200 OK em milissegundos e processo a carga de forma assíncrona</option>
      </select>
    </div>

    <div class="question">
      <label>4. Como é feita a segurança dos dados recebidos externamente?</label>
      <select id="q4" required>
        <option value="1">A rota é pública e qualquer requisição recebida é executada</option>
        <option value="2">Coloco uma senha secreta simples enviada no corpo da mensagem</option>
        <option value="3">Uso chaves de API fixas passadas pela URL (query parameters)</option>
        <option value="4">Uso HTTPS obrigatório e validação de token/assinatura criptográfica no header</option>
      </select>
    </div>

    <div class="question">
      <label>5. Qual o nível de desacoplamento do seu fluxo técnico?</label>
      <select id="q5" required>
        <option value="1">Tudo em um único bloco visual: se um passo falha, todo o resto quebra</option>
        <option value="2">Uso blocos de erro básicos que apenas enviam alerta por e-mail</option>
        <option value="3">Separo entrada de dados do armazenamento final em duas tabelas</option>
        <option value="4">Arquitetura modular com filas, logs de execução e rota de tratamento de exceções (Dead-Letter)</option>
      </select>
    </div>

    <button type="submit">Calcular Meu Nível</button>
  </form>

  <div id="result-box">
    <div class="score-title" id="score-text"></div>
    <div class="thermometer-track">
      <div class="thermometer-fill" id="thermo-fill"></div>
    </div>
    <div class="score-desc" id="score-analysis"></div>
  </div>
</div>

<script>
  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const q1 = parseInt(document.getElementById('q1').value);
    const q2 = parseInt(document.getElementById('q2').value);
    const q3 = parseInt(document.getElementById('q3').value);
    const q4 = parseInt(document.getElementById('q4').value);
    const q5 = parseInt(document.getElementById('q5').value);

    const totalPoints = q1 + q2 + q3 + q4 + q5; // Min: 5, Max: 20
    const percent = Math.round(((totalPoints - 5) / 15) * 100);

    const resultBox = document.getElementById('result-box');
    const thermoFill = document.getElementById('thermo-fill');
    const scoreText = document.getElementById('score-text');
    const scoreAnalysis = document.getElementById('score-analysis');

    resultBox.style.display = 'block';
    thermoFill.style.width = percent + '%';

    if (percent <= 30) {
      thermoFill.style.background = '#e53e3e'; // Vermelho / Frio
      scoreText.innerText = `Maturidade: ${percent}% (Zona Crítica: Polling Excessivo)`;
      scoreAnalysis.innerHTML = '<strong>Diagnóstico:</strong> Seu fluxo consome recursos de forma ineficiente via consultas periódicas e não possui proteção contra duplicatas. <em>Próximo passo:</em> Praticar recepção de Webhooks HTTP POST e eliminar rotinas de agendamento minuto a minuto.';
    } else if (percent <= 65) {
      thermoFill.style.background = '#dd6b20'; // Laranja
      scoreText.innerText = `Maturidade: ${percent}% (Zona de Transição: Automação Prática)`;
      scoreAnalysis.innerHTML = '<strong>Diagnóstico:</strong> Você já utiliza recursos visuais e entende o valor dos eventos, mas seu fluxo corre risco de quebra sob alta concorrência. <em>Próximo passo:</em> Implementar resposta rápida (Ack 200 OK) e controle de idempotência via ID exclusivo.';
    } else if (percent <= 85) {
      thermoFill.style.background = '#3182ce'; // Azul
      scoreText.innerText = `Maturidade: ${percent}% (Zona Eficiente: Arquitetura Reativa)`;
      scoreAnalysis.innerHTML = '<strong>Diagnóstico:</strong> Excelente domínio de eventos, cabeçalhos de segurança e tratamento de dados assíncrono. <em>Próximo passo:</em> Adicionar filas intermediárias de contingência e monitoramento de logs.';
    } else {
      thermoFill.style.background = '#38a169'; // Verde
      scoreText.innerText = `Maturidade: ${percent}% (Zona de Excelência: Engenharia Resiliente)`;
      scoreAnalysis.innerHTML = '<strong>Diagnóstico:</strong> Suas automações comportam-se como software de alto nível: seguras, desacopladas, assíncronas e à prova de falhas duplicadas.';
    }

    resultBox.scrollIntoView({ behavior: 'smooth' });
  });
</script>

</body>
</html>
